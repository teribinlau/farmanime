<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>群芳牧场 · 试玩</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#2b2233;overscroll-behavior:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{display:block;touch-action:none;-webkit-user-select:none;user-select:none}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<script>
// 浏览器里模拟游戏用到的一小部分 wx API。宽屏（电脑）时按手机比例居中显示。
(function () {
  var cv = document.getElementById('c');
  var vw = window.innerWidth, vh = window.innerHeight;
  var w = vw, h = vh;
  if (vw / vh > 0.62) { h = vh; w = Math.round(vh * 0.5); }
  var first = true;
  var safeTop = 0;
  window.wx = {
    getSystemInfoSync: function () {
      return { windowWidth: w, windowHeight: h, pixelRatio: window.devicePixelRatio || 1,
               safeArea: { top: safeTop, bottom: h } };
    },
    createCanvas: function () {
      if (first) { first = false; cv.style.width = w + 'px'; cv.style.height = h + 'px'; return cv; }
      return document.createElement('canvas');
    },
    createImage: function () {
      var im = new Image(), inl = window.__INLINE_IMAGES;
      if (!inl) return im;
      var setSrc = Object.getOwnPropertyDescriptor(HTMLImageElement.prototype, 'src').set;
      Object.defineProperty(im, 'src', { set: function (v) {
        var k = String(v).replace(/^images\//, '').replace(/\.png$/, '');
        setSrc.call(im, inl[k] || v);
      }, get: function () { return im.currentSrc; } });
      return im;
    },
    onTouchStart: function (fn) {
      cv.addEventListener('pointerdown', function (e) {
        var r = cv.getBoundingClientRect();
        var t = { clientX: e.clientX - r.left, clientY: e.clientY - r.top };
        fn({ touches: [t], changedTouches: [t] });
      });
    },
    // 音效：手机浏览器要在第一次触摸后才允许出声
    createInnerAudioContext: function () {
      var a = new Audio(), inl = window.__INLINE_SOUNDS || {};
      a.preload = 'auto';
      return {
        set src(v) { var k = String(v).replace(/^audio\//, '').replace(/\.wav$/, ''); a.src = inl[k] || v; },
        get src() { return a.src; },
        play: function () { var p = a.play(); if (p && p.catch) p.catch(function () {}); },
        stop: function () { a.pause(); try { a.currentTime = 0; } catch (e) {} },
        seek: function (t) { try { a.currentTime = t; } catch (e) {} },
      };
    },
    vibrateShort: function (o) { if (navigator.vibrate) navigator.vibrate(o && o.type === 'medium' ? 25 : 12); },
    shareAppMessage: navigator.share ? function (o) {
      navigator.share({ title: '群芳牧场', text: o.title }).catch(function () {});
    } : undefined,
    getStorageSync: function (k) { try { return JSON.parse(localStorage.getItem(k)) || ''; } catch (e) { return ''; } },
    setStorageSync: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  };
})();
</script>
<script src="game.js"></script>
</body>
</html>
